name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build e testes
    runs-on: ubuntu-latest
    # execution: env:
    # execution:   DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # execution: - name: Gerar Prisma Client
      # execution:   run: npx prisma generate

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Testes unitários e BDD com cobertura
        run: npm run test:cov

      - name: Publicar relatório de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-billing-service
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    # execution: env:
    # execution:   DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # execution: - name: Gerar Prisma Client
      # execution:   run: npx prisma generate

      - name: Testes de integração (Testcontainers + MiniStack)
        run: npm run test:integracao

  sonar:
    name: Qualidade (SonarQube)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    # execution: env:
    # execution:   DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # execution: - name: Gerar Prisma Client
      # execution:   run: npx prisma generate

      - name: Baixar relatório de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura-billing-service
          path: coverage

      - name: Análise e quality gate
        run: bash scripts/sonar-quality-gate.sh
        env:
          SONAR_HOST_URL: http://localhost:9000

  contratos:
    name: Contratos sincronizados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar contratos do os-service (develop)
        run: |
          git clone --depth 1 --branch develop \
            https://github.com/FIAP-POS-TECH-SOFTWARE-ARCHITECTURE/tc-oficina-os-service.git \
            "$RUNNER_TEMP/os-service"

      - name: Comparar com a cópia local
        run: |
          if diff -r "$RUNNER_TEMP/os-service/contratos" contratos; then
            echo "contratos/ idêntico ao tc-oficina-os-service (develop)"
          else
            echo "::error::contratos/ diverge do tc-oficina-os-service (develop). Atualize a cópia a partir da fonte da verdade."
            exit 1
          fi
