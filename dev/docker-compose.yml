services:
  ministack:
    image: ministackorg/ministack:1.5.17
    container_name: oficina-billing-ministack-dev
    ports:
      - "4566:4566"
    environment:
      MINISTACK_REGION: us-east-1

  sonarqube:
    image: sonarqube:community
    container_name: oficina-billing-sonarqube-dev
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
